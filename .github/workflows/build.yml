name: 构建 Electron 桌面安装包

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'CLAUDE.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        shell: bash
        run: echo "version=$(node -p "require('./electron/package.json').version")" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: [app-version]
    runs-on: macos-latest
    env:
      APP_VERSION: ${{ needs.app-version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: desktop/web/pnpm-lock.yaml

      - name: 构建前端
        run: |
          cd desktop/web
          pnpm install --frozen-lockfile
          pnpm run build

      - name: 安装 Electron 依赖
        working-directory: electron
        run: pnpm install --frozen-lockfile

      - name: 构建 macOS Electron 安装包
        working-directory: electron
        run: npx electron-builder --mac --publish never

      - name: 生成 Electron 更新元数据
        run: node electron/scripts/generate-update-info.mjs
        env:
          APP_VERSION: ${{ env.APP_VERSION }}

      - name: 上传 macOS 构建产物
        uses: actions/upload-artifact@v7
        with:
          name: MediaForge-Electron-macOS-${{ env.APP_VERSION }}
          path: |
            electron/out/*.dmg
            electron/out/*.zip
            electron/out/latest-mac.yml
          if-no-files-found: error

  build-windows:
    needs: [app-version]
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ needs.app-version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: desktop/web/pnpm-lock.yaml

      - name: 构建前端
        shell: bash
        run: |
          cd desktop/web
          pnpm install --frozen-lockfile
          pnpm run build

      - name: 安装 Electron 依赖
        working-directory: electron
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: 构建 Windows Electron 安装包
        working-directory: electron
        shell: bash
        run: npx electron-builder --win --publish never

      - name: 生成 Electron 更新元数据
        shell: bash
        run: node electron/scripts/generate-update-info.mjs
        env:
          APP_VERSION: ${{ env.APP_VERSION }}

      - name: 上传 Windows 构建产物
        uses: actions/upload-artifact@v7
        with:
          name: MediaForge-Electron-Windows-${{ env.APP_VERSION }}
          path: |
            electron/out/*.exe
            electron/out/latest.yml
          if-no-files-found: error

  create-release:
    needs: [app-version, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          pattern: MediaForge-Electron-*
          path: release-assets
          merge-multiple: true

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.app-version.outputs.version }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "MediaForge $TAG" --notes "Electron 自动更新版本"
          fi

      - name: 上传 Electron 构件和更新元数据到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ needs.app-version.outputs.version }}" release-assets/*
